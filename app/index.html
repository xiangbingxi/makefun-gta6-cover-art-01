<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA VI cover art maker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23ff7a3d'/%3E%3Ccircle cx='16' cy='20' r='9' fill='%23ffe9a8'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice Cover Studio</h1>
    <p class="tag">Your photos and a caption, made into Vice City neon-sunset cover art — exported as a PNG to share.</p>

    <fieldset>
      <legend>Photos</legend>
      <label>Hero photo <input id="photo1" type="file" accept="image/*"></label>
      <label>Second photo <input id="photo2" type="file" accept="image/*"></label>
      <label>Third photo <input id="photo3" type="file" accept="image/*"></label>
      <p class="hint">A panel with no photo is filled with a hand-drawn sunset scene. Where the browser finds a face, the panel frames it.</p>
    </fieldset>

    <fieldset>
      <legend>Layout</legend>
      <div id="layouts" class="row"></div>
    </fieldset>

    <fieldset>
      <legend>Grade</legend>
      <div id="grades" class="row"></div>
    </fieldset>

    <fieldset>
      <legend>Lettering</legend>
      <label>Title <input id="title" type="text" maxlength="40" value="Sunset Heist"></label>
      <label>Subtitle <input id="subtitle" type="text" maxlength="40" value="A Leonida Story"></label>
      <label>Callout, left <input id="calloutA" type="text" maxlength="24" value="Golden Hour"></label>
      <label>Callout, right <input id="calloutB" type="text" maxlength="24" value="The Getaway"></label>
      <label>Billing line <input id="billing" type="text" maxlength="80" value="A LEONIDA STORY  •  STARRING YOU  •  SHOT ON THE BOULEVARD"></label>
    </fieldset>

    <fieldset>
      <legend>Framing</legend>
      <label>Zoom <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1"></label>
      <label>Focus, left–right <input id="focusX" type="range" min="0" max="1" step="0.05" value="0.5"></label>
      <label>Focus, top–bottom <input id="focusY" type="range" min="0" max="1" step="0.05" value="0.5"></label>
    </fieldset>

    <fieldset>
      <legend>Export</legend>
      <div id="sizes" class="row"></div>
      <div class="row">
        <button id="export" type="button">Export PNG</button>
        <button id="exportAll" type="button">Export all 4 sizes</button>
      </div>
      <p id="status" role="status"></p>
    </fieldset>
  </section>
  <section class="preview" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
